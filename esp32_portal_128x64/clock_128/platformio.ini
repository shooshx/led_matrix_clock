; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; the web UI is uploaded to LittleFS with "pio run -t uploadfs".
; gzip_web.py makes this folder from ../main_ui, the files gzipped
data_dir = .pio/web_data

[env:adafruit_matrixportal_esp32s3]
platform = espressif32
board = adafruit_matrixportal_esp32s3
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
lib_deps =
    esp32async/ESPAsyncWebServer
    esp32async/AsyncTCP
    bblanchon/ArduinoJson@^7
    arduino-libraries/NTPClient
    paulstoffregen/Time
    h2zero/NimBLE-Arduino@^1.4.3
    https://github.com/pschatzmann/arduino-libhelix.git#v0.9.4
; NimBLE: info logs (disconnect reasons...) and the text of error codes, for pairing.
; it keeps 3 bonds by default and when they are full drops the oldest, room for more so that pairing a new
; device doesn't lose the old ones
build_flags =
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=3
    -DCONFIG_NIMBLE_CPP_ENABLE_RETURN_CODE_TEXT
    -DCONFIG_BT_NIMBLE_MAX_BONDS=8
extra_scripts = pre:gzip_web.py
