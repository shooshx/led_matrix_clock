<script>



const DISCONNECTED = 0
const CONNECTING = 1
const CONNECTED = 2

class WsWrap {
    constructor() {
        this.ws = null
        this.state = DISCONNECTED
        this.send_q = []
    }
    send(v) 
    {
        if (this.state != CONNECTED) {
            this.send_q.push(v)
            if (this.state == DISCONNECTED)
                this.connect()
            return
        }
        try {
            this.ws.send(v)
        }
        catch(e) {
            console.log(e)
        }
    }

    // calls cb once everything sent so far has left the browser
    when_sent(cb)
    {
        const check = ()=>{
            if (this.state == CONNECTED && this.send_q.length == 0 && this.ws.bufferedAmount == 0)
                cb()
            else
                window.setTimeout(check, 100)
        }
        check()
    }

    connect()
    {
        let url = ""
        if (window.location.protocol == "https:")
            url = "wss://"
        else
            url = "ws://"
        url += window.location.host // includes the port if there is one
        url += "/ws"
        console.log("ws url: ", url)

        //url = "ws://localhost"

        const ws = new WebSocket(url) //, "cmdss")
        this.ws = ws
        this.state = CONNECTING
        ws.addEventListener("open", (e)=>{
            //socket.send("Hello Server!")
            console.log("WS connected q:", this.send_q.length)
            this.state = CONNECTED
            if (this.send_q.length > 0) {
                const sq = this.send_q
                this.send_q = []
                for(let msg of sq)
                    this.send(msg)
            }
        })

        ws.addEventListener("message", (e)=>{
            console.log("WS mesg:", e.data)
        })

        ws.addEventListener("error", (e)=>{
            console.log("WS error:", e, " b ", JSON.stringify(e), " c ", ws.readyState, " d ", JSON.stringify(ws))
            this.ws.close()
            this.state = DISCONNECTED
        })
        ws.addEventListener("close", (e)=>{
            console.log("WS close:", e, " a ", e.code, " b ", JSON.stringify(e))
            this.ws.close()
            this.state = DISCONNECTED
        })

    }
}
const ws_wrap = new WsWrap()


const sections = []

function create_section(parent, text, active_section, send_update)
{
    const cont = add_div(parent, 'section_cont')
    const header = add_div(cont, 'section_hdr')
    header.innerText = text
    const e = add_div(cont, 'section_elem')
    const my_index = sections.length
    const init_vis = (active_section == my_index)
    header.addEventListener('click', ()=>{
        for(let s of sections) {
            if (s.e !== e) {
                s.e.style.display = 'none'
                s.header.setAttribute('selected', false)
            }
        }
        e.style.display = 'initial'
        header.setAttribute('selected', true)
        send_update('active_section', my_index)
    })
    e.style.display = init_vis ? 'initial' : 'none'
    header.setAttribute('selected', init_vis)
    sections.push({header:header, e:e, name:text, index:my_index})
    return e
}

function add_glob_prop_ui(parent, prefJson, send_update)
{
    const cont = add_div(parent, 'glob_prop')
    add_elem(cont, 'span', 'bright_label').innerText = 'Brightness:'
    add_slider(cont, 'bright_in', 0, 255, prefJson['brightness'] || 0, (v)=>{
        send_update('brightness', v)
    })
    // in tenths: 10 is 1.0 (none), higher makes the bright colors more distinct and the dark ones darker
    const gcont = add_div(parent, 'glob_prop')
    add_elem(gcont, 'span', 'bright_label').innerText = 'Gamma:'
    const gamma = prefJson['gamma'] || 10
    add_slider(gcont, 'bright_in', 10, 30, gamma, (v)=>{
        gval.innerText = (v / 10).toFixed(1)
        send_update('gamma', v)
    })
    const gval = add_elem(gcont, 'span', 'gamma_val')
    gval.innerText = (gamma / 10).toFixed(1)

    // bits per color of the panel: more is smoother colors and more flicker. the panel says what it could do
    const ccont = add_div(parent, 'glob_prop')
    const opts = [2, 3, 4, 5, 6].map((b)=>({value:b, text:b + " bits (" + (1 << b) + " levels)"}))
    const status = add_elem(ccont, 'span', 'color_bits_status')
    const sel = add_select(ccont, "Color depth: ", opts, prefJson['color_bits_actual'] || prefJson['color_bits'] || 4, (v)=>{
        status.innerText = " applying..."
        send_update('color_bits', v)
        // ask the panel what it could do. it may not answer while it's switching, then try again
        const check = (tries)=>{
            download("/pref?t=" + new Date().getTime(), (t)=>{
                const actual = JSON.parse(t)['color_bits_actual']
                if (actual === undefined || actual == v)
                    status.innerText = ""
                else {
                    status.innerText = " not enough memory, still " + actual + " bits"
                    sel.value = actual
                }
            }, ()=>{
                if (tries > 1)
                    window.setTimeout(()=>{ check(tries - 1) }, 2000)
                else
                    status.innerText = " the panel doesn't answer"
            })
        }
        window.setTimeout(()=>{ check(4) }, 1500)
    })
    ccont.appendChild(status) // after the select
}

function create_ui(prefJson)
{
    const active_section = prefJson['active_section'] || 0
    // the orientation the panel stands in, the Draw and Image tabs are in its coordinates.
    // they don't change if the panel turns while the page is open, it needs a reload
    const portrait = ((prefJson['rotation'] || 0) & 1) != 0
    const px_width = portrait ? PX_SHORT : PX_LONG
    const px_height = portrait ? PX_LONG : PX_SHORT
    const send_update = (name, value)=>{
        const cmd = "U " + name + " " + value
        ws_wrap.send(cmd)
    }
    const send_off_update = (name, value)=>{
        send_update(name, value)
        ws_wrap.send("DC")
    }

    const off_e = create_section(body, 'Off', active_section, send_off_update)
    const clk_e = create_section(body, 'Clock', active_section, send_update)
    clock_create(clk_e, prefJson, ws_wrap, portrait)
    const timer_e = create_section(body, "Timer", active_section, send_update)
    timer_create(timer_e, prefJson, ws_wrap, portrait)

    const stopw_e = create_section(body, "Stop Watch", active_section, send_update)
    stop_watch_create(stopw_e, prefJson, ws_wrap, portrait)

    const draw_e = create_section(body, 'Draw', active_section, send_update)
    draw_pixel_create(draw_e, px_width, px_height, ws_wrap)

    let send_img = null
    // send the current image when the section is opened
    const send_img_update = (name, value)=>{
        send_update(name, value)
        send_img()
    }
    const img_e = create_section(body, 'Image', active_section, send_img_update)
    send_img = draw_image_create(img_e, px_width, px_height, ws_wrap)

    // not a panel section, opening it only refreshes the shown prefs instead of changing active_section
    let prefs_refresh = null
    const prefs_e = create_section(body, 'Prefs', active_section, ()=>{ prefs_refresh() })
    prefs_refresh = prefs_create(prefs_e, send_update, (cb)=>{ ws_wrap.when_sent(cb) })

    add_glob_prop_ui(body, prefJson, send_update)
}

function rt_start()
{
    ws_wrap.connect()

    download("/pref?t=" + new Date().getTime(), (resText)=>{
        const prefJson = JSON.parse(resText)       
        create_ui(prefJson)
    })
    
}

// wasm finish loadin will call this
var Module = {
    onRuntimeInitialized: rt_start
}

</script>
